name = "subtrack-daily-reminder"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 13:00 UTC = 21:00 Singapore Time (UTC+8, no DST)
[triggers]
crons = ["0 13 * * *"]

# Set via `wrangler secret put <NAME>` — never commit real values:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT (e.g. "mailto:you@example.com")
